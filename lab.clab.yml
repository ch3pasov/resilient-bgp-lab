# Minimal Containerlab smoke test:
# two Linux nodes connected by a point-to-point Ethernet link.

name: first-lab

topology:
  nodes:
    client:
      kind: linux
      image: alpine:3.20
      cmd: sleep infinity
      exec:
        - ip address add 10.0.0.1/30 dev eth1
        - ip link set eth1 up

    server:
      kind: linux
      image: alpine:3.20
      cmd: sleep infinity
      exec:
        - ip address add 10.0.0.2/30 dev eth1
        - ip link set eth1 up

  links:
    - endpoints:
        - client:eth1
        - server:eth1
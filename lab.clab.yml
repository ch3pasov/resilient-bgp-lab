name: redundant-lab

topology:
  nodes:
    client:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - configs/client.conf:/etc/frr/frr.conf
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
      sysctls:
        net.ipv4.ip_forward: "1"

    router-a:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - configs/router-a.conf:/etc/frr/frr.conf
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
      sysctls:
        net.ipv4.ip_forward: "1"

    router-b:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - configs/router-b.conf:/etc/frr/frr.conf
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
      sysctls:
        net.ipv4.ip_forward: "1"

    server:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - configs/server.conf:/etc/frr/frr.conf
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
      sysctls:
        net.ipv4.ip_forward: "1"

  links:
    - endpoints:
        - client:eth1
        - router-a:eth1

    - endpoints:
        - router-a:eth2
        - server:eth2

    - endpoints:
        - client:eth3
        - router-b:eth3

    - endpoints:
        - router-b:eth4
        - server:eth4
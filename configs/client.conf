frr defaults traditional
hostname client
service integrated-vtysh-config
!
interface lo
 ip address 192.168.0.1/32
!
interface eth1
 ip address 10.0.1.2/30
!
interface eth3
 ip address 10.0.3.2/30
!
router bgp 65001
 bgp router-id 192.168.0.1
 no bgp ebgp-requires-policy
 neighbor 10.0.1.1 remote-as 65010
 neighbor 10.0.3.1 remote-as 65020
 !
 address-family ipv4 unicast
  network 192.168.0.1/32
 exit-address-family
!
ip prefix-list SERVER-LOOPBACK seq 10 permit 192.168.0.2/32
!
route-map BGP-PREFERRED-SOURCE permit 10
 match ip address prefix-list SERVER-LOOPBACK
 set src 192.168.0.1
!
ip protocol bgp route-map BGP-PREFERRED-SOURCE
!
line vty
!